name: Build multi-arch frontend image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/culerty2000516/shopstack-frontend

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    outputs:
      sha_image: ${{ steps.meta.outputs.sha_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "sha_image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push AMD64 and ARM64 image
        shell: bash
        run: |
          set -euo pipefail

          TAG_ARGS=(
            -t "${IMAGE_NAME}:${GITHUB_SHA}"
          )

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            TAG_ARGS+=(
              -t "${IMAGE_NAME}:${SEMVER}"
            )
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${TAG_ARGS[@]}" \
            frontend-src/

  scan:
    name: Trivy CRITICAL scan
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Scan pushed image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build.outputs.sha_image }}
          format: table
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
